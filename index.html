<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parts Request — Perfect Relax</title>
<style>
  :root {
    --ink: #15203D;
    --deep: #1B3E8F;
    --sage: #EEF3FC;
    --sage-line: #D7E1F5;
    --gold: #2F5FD1;
    --gold-soft: #E3EAFB;
    --white: #FFFFFF;
    --ok: #3E7A52;
    --ok-soft: #E4F1E7;
    --pending: #A85E1D;
    --pending-soft: #F7E9D8;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--sage);
    color: var(--ink);
    line-height: 1.5;
  }

  header {
    background: var(--deep);
    color: var(--white);
    padding: 22px 24px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  .header-logo {
    height: 56px;
    width: auto;
    background: var(--white);
    border-radius: 8px;
    padding: 6px 10px;
    flex-shrink: 0;
  }

  .header-text {
    flex: 1 1 auto;
  }

  .header-text h1 {
    margin: 0 0 4px;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  .header-text p {
    margin: 0;
    color: #C9D6F7;
    font-size: 0.92rem;
  }

  .header-actions {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  .header-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--white);
    color: var(--deep);
    border: 1px solid var(--sage-line);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }

  .header-btn:hover { background: var(--sage); }
  .header-btn svg { flex-shrink: 0; }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  .panel {
    background: var(--white);
    border: 1px solid var(--sage-line);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 24px;
  }

  .panel h2 {
    margin: 0 0 16px;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--deep);
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }

  label {
    font-size: 0.82rem;
    font-weight: 600;
    color: #44506E;
  }

  input, textarea {
    border: 1px solid var(--sage-line);
    border-radius: 7px;
    padding: 9px 11px;
    font-size: 0.95rem;
    font-family: inherit;
    background: #FBFCFF;
    color: var(--ink);
  }

  input:focus, textarea:focus {
    outline: none;
    border-color: var(--gold);
    background: var(--white);
  }

  textarea { resize: vertical; min-height: 64px; }

  .actions { margin-top: 16px; display: flex; align-items: center; gap: 12px; }

  button {
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    border: none;
    border-radius: 7px;
    padding: 10px 20px;
    cursor: pointer;
  }

  .btn-primary { background: var(--deep); color: var(--white); }
  .btn-primary:hover { background: #142F70; }
  .btn-primary:disabled { background: #A9B4CE; cursor: not-allowed; }

  .btn-ghost { background: var(--gold-soft); color: #1B3E8F; }
  .btn-ghost:hover { background: #D7E1F7; }

  .status-msg { font-size: 0.86rem; color: #44506E; }
  .status-msg.error { color: #B23A2E; }
  .status-msg.success { color: var(--ok); }

  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }

  th {
    text-align: left;
    padding: 10px 12px;
    background: #EEF3FC;
    color: #44506E;
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    border-bottom: 1px solid var(--sage-line);
  }

  td {
    padding: 11px 12px;
    border-bottom: 1px solid #E3EAF7;
    vertical-align: top;
  }

  tr:last-child td { border-bottom: none; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .badge.pending { background: var(--pending-soft); color: var(--pending); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.progres { background: var(--gold-soft); color: var(--deep); }

  .resi-btn {
    background: transparent;
    color: var(--deep);
    border: 1px solid var(--deep);
    padding: 5px 12px;
    font-size: 0.8rem;
    border-radius: 6px;
  }
  .resi-btn:hover { background: var(--deep); color: var(--white); }

  .field-edit-btn { margin-left: 8px; }
  td[data-label="No Resi"], td[data-label="Progres"] { white-space: nowrap; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #7C88A8;
    font-size: 0.9rem;
  }

  .config-warning {
    background: #FDECEC;
    border: 1px solid #F3B9B4;
    color: #8C2E24;
    padding: 12px 16px;
    border-radius: var(--radius);
    margin-bottom: 20px;
    font-size: 0.88rem;
  }

  .config-warning code {
    background: #FBD9D6;
    padding: 1px 5px;
    border-radius: 4px;
  }

  /* Modal */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 30, 29, 0.45);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--white);
    border-radius: var(--radius);
    padding: 22px;
    width: 100%;
    max-width: 380px;
  }

  .modal h3 { margin: 0 0 4px; font-size: 1.05rem; color: var(--deep); }
  .modal p { margin: 0 0 14px; font-size: 0.85rem; color: #5C6B8C; }

  .modal-actions { margin-top: 16px; display: flex; justify-content: flex-end; gap: 10px; }

  .btn-cancel { background: #E3EAF7; color: #44506E; }
  .btn-cancel:hover { background: #E1E8F7; }

  .part-rows { display: flex; flex-direction: column; gap: 8px; }

  .part-row {
    display: grid;
    grid-template-columns: 2.2fr 90px 32px;
    gap: 8px;
    align-items: start;
  }

  .foto-preview-wrap {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .foto-preview-wrap img {
    width: 84px;
    height: 84px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--sage-line);
  }

  .foto-remove-btn {
    background: #F6E7E5;
    color: #A83A2E;
    padding: 6px 12px;
    font-size: 0.8rem;
    border-radius: 6px;
  }
  .foto-remove-btn:hover { background: #F0D2CE; }

  .hint-text {
    font-size: 0.78rem;
    color: #8290AF;
    margin-top: 4px;
    display: block;
  }

  .foto-thumb {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--sage-line);
    cursor: pointer;
  }

  .autocomplete-wrap { position: relative; }

  .part-row input[type="text"] { width: 100%; }

  .autocomplete-list {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--white);
    border: 1px solid var(--sage-line);
    border-radius: 8px;
    box-shadow: 0 6px 16px rgba(28, 43, 42, 0.12);
    max-height: 220px;
    overflow-y: auto;
    z-index: 5;
  }

  .autocomplete-list.open { display: block; }

  .autocomplete-item {
    display: flex;
    gap: 8px;
    align-items: baseline;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 0.88rem;
  }
  .autocomplete-item:hover,
  .autocomplete-item:active { background: #EEF3FC; }

  .autocomplete-item .ac-kode {
    font-weight: 600;
    color: var(--deep);
    flex-shrink: 0;
  }
  .autocomplete-item .ac-nama { color: #51608A; }

  .autocomplete-empty {
    padding: 9px 12px;
    font-size: 0.82rem;
    color: #8290AF;
    font-style: italic;
  }

  .part-row input[type="number"] { width: 100%; text-align: center; }

  .part-row .remove-row {
    background: #F6E7E5;
    color: #A83A2E;
    border: none;
    border-radius: 6px;
    width: 32px;
    height: 34px;
    padding: 0;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
  }
  .part-row .remove-row:hover { background: #F0D2CE; }

  .part-row .custom-name {
    grid-column: 1 / -1;
  }

  .btn-add-row {
    align-self: flex-start;
    background: transparent;
    color: var(--deep);
    border: 1px dashed var(--sage-line);
    padding: 8px 14px;
    font-size: 0.85rem;
    border-radius: 7px;
  }
  .btn-add-row:hover { border-color: var(--deep); background: #EEF3FC; }

  @media (max-width: 600px) {
    .part-row { grid-template-columns: 1fr 70px 32px; }
    .grid { grid-template-columns: 1fr; }
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tr { border-bottom: 1px solid var(--sage-line); padding: 10px 0; }
    td { border: none; padding: 4px 0; }
    td::before {
      content: attr(data-label);
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #8592B3;
      margin-bottom: 2px;
    }
  }
</style>
</head>

<main>
  <div id="configWarning" class="config-warning" style="display:none;">

    dan isi dengan URL hasil deploy Apps Script kamu.
  </div>

  <section class="panel">
    <h2>Ajukan Request Baru</h2>
    <form id="requestForm">
      <div class="grid">
        <div class="field">
          <label for="nama">Nama</label>
          <input type="text" id="nama" required>
        </div>
        <div class="field">
          <label for="lokasi">Lokasi</label>
          <div class="autocomplete-wrap">
            <input type="text" id="lokasi" required autocomplete="off" placeholder="Ketik kode atau nama outlet…">
            <div class="autocomplete-list" id="lokasiList"></div>
          </div>
        </div>
        <div class="field">
          <label for="noKursi">No Kursi</label>
          <input type="text" id="noKursi" required>
        </div>
        <div class="field">
          <label for="alamatDiterima">Alamat Diterima</label>
          <input type="text" id="alamatDiterima" required>
        </div>
        <div class="field full">
          <label>Parts (barang yang di-request)</label>
          <div id="partRows" class="part-rows"></div>
          <button type="button" id="addPartRow" class="btn-add-row">+ Tambah Item</button>
        </div>
        <div class="field full">
          <label for="fotoInput">Foto Lokasi/Kondisi (opsional)</label>
          <input type="file" id="fotoInput" accept="image/*">
          <div id="fotoPreviewWrap" class="foto-preview-wrap" style="display:none;">
            <img id="fotoPreviewImg" alt="Preview foto">
            <button type="button" id="fotoRemoveBtn" class="foto-remove-btn">Hapus foto</button>
          </div>
          <span class="hint-text" id="fotoHint"></span>
        </div>
      </div>
      <div class="actions">
        <button type="submit" class="btn-primary" id="submitBtn">Kirim Request</button>
        <span class="status-msg" id="formStatus"></span>
      </div>
    </form>
  </section>

  <section class="panel" id="daftarRequestPanel" style="display:none;">
    <h2>Daftar Request</h2>
    <div id="tableWrap">
      <div class="empty-state">Memuat data…</div>
    </div>
  </section>
</main>

  const partRows = document.getElementById('partRows');
  const addPartRowBtn = document.getElementById('addPartRow');

  function filterParts(query) {
    const q = query.trim().toLowerCase();
    if (!q) return PARTS_LIST.filter(function (p) { return p.kode !== 'Lain Lain'; }).slice(0, 8);
    return PARTS_LIST.filter(function (p) {
      return p.kode !== 'Lain Lain' && (
        p.kode.toLowerCase().indexOf(q) !== -1 ||
        p.nama.toLowerCase().indexOf(q) !== -1
      );
    }).slice(0, 8);
  }

  function renderSuggestions(listEl, matches) {
    if (matches.length === 0) {
      listEl.innerHTML = '<div class="autocomplete-empty">Tidak ada di daftar — akan disimpan sebagai teks bebas</div>';
      listEl.classList.add('open');
      return;
    }
    listEl.innerHTML = matches.map(function (p) {
      return '<div class="autocomplete-item" data-kode="' + escapeAttr(p.kode) + '" data-nama="' + escapeAttr(p.nama) + '">' +
        '<span class="ac-kode">' + escapeHtml(p.kode) + '</span>' +
        '<span class="ac-nama">' + escapeHtml(p.nama) + '</span>' +
        '</div>';
    }).join('');
    listEl.classList.add('open');
  }

  function addPartRow() {
    const row = document.createElement('div');
    row.className = 'part-row';
    row.innerHTML =
      '<div class="autocomplete-wrap">' +
        '<input type="text" class="part-input" placeholder="Ketik nama atau kode part…" autocomplete="off">' +
        '<div class="autocomplete-list"></div>' +
      '</div>' +
      '<input type="number" class="part-qty" min="1" value="1" placeholder="Qty">' +
      '<button type="button" class="remove-row" title="Hapus item">&times;</button>';

    const input = row.querySelector('.part-input');
    const list = row.querySelector('.autocomplete-list');

    input.addEventListener('input', function () {
      row.dataset.kode = ''; // ketikan berubah, lepas kaitan ke part terpilih
      renderSuggestions(list, filterParts(input.value));
    });

    input.addEventListener('focus', function () {
      renderSuggestions(list, filterParts(input.value));
    });

    list.addEventListener('mousedown', function (e) {
      const item = e.target.closest('.autocomplete-item');
      if (!item) return;
      e.preventDefault();
      input.value = item.getAttribute('data-kode') + ' — ' + item.getAttribute('data-nama');
      row.dataset.kode = item.getAttribute('data-kode');
      list.classList.remove('open');
    });

    input.addEventListener('blur', function () {
      setTimeout(function () { list.classList.remove('open'); }, 100);
    });

    row.querySelector('.remove-row').addEventListener('click', function () {
      if (partRows.children.length > 1) {
        row.remove();
      } else {
        input.value = '';
        row.dataset.kode = '';
        row.querySelector('.part-qty').value = 1;
      }
    });

    partRows.appendChild(row);
  }

  addPartRowBtn.addEventListener('click', addPartRow);

  function collectParts() {
    const items = [];
    partRows.querySelectorAll('.part-row').forEach(function (row) {
      const input = row.querySelector('.part-input');
      const qty = row.querySelector('.part-qty').value || '1';
      const typed = input.value.trim();
      if (!typed) return; // baris kosong, diabaikan

      let label = typed;
      const kode = row.dataset.kode;
      if (kode) {
        const found = PARTS_LIST.find(function (p) { return p.kode === kode; });
        if (found) label = found.kode + ' - ' + found.nama;
      }

      items.push(label + ' (x' + qty + ')');
    });
    return { text: items.join('; '), count: items.length };
  }

  let fotoDataUrl = null; // hasil kompres, siap dikirim

  const MAX_FOTO_DIMENSION = 1280;
  const MAX_ORIGINAL_MB = 15;

  function compressImage(file, maxDim) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
            else { w = Math.round(w * (maxDim / h)); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.75));
        };
        img.onerror = function () { reject(new Error('Gagal membaca gambar')); };
        img.src = e.target.result;
      };
      reader.onerror = function () { reject(new Error('Gagal membaca file')); };
      reader.readAsDataURL(file);
    });
  }

  fotoInput.addEventListener('change', async function () {
    const file = fotoInput.files[0];
    if (!file) return;

    if (file.size > MAX_ORIGINAL_MB * 1024 * 1024) {
      fotoHint.textContent = 'Ukuran foto terlalu besar (maks ' + MAX_ORIGINAL_MB + 'MB).';
      fotoInput.value = '';
      return;
    }

    fotoHint.textContent = 'Memproses foto…';
    try {
      fotoDataUrl = await compressImage(file, MAX_FOTO_DIMENSION);
      fotoPreviewImg.src = fotoDataUrl;
      fotoPreviewWrap.style.display = 'flex';
      fotoHint.textContent = '';
    } catch (err) {
      fotoHint.textContent = 'Gagal memproses foto: ' + err.message;
      fotoDataUrl = null;
    }
  });

    fotoInput.value = '';
    fotoPreviewWrap.style.display = 'none';
    fotoHint.textContent = '';

    fotoDataUrl = null;

    fotoPreviewWrap.style.display = 'none';
    fotoHint.textContent = '';

  const form = document.getElementById('requestForm');
  const submitBtn = document.getElementById('submitBtn');
  const formStatus = document.getElementById('formStatus');
  const tableWrap = document.getElementById('tableWrap');
  const configWarning = document.getElementById('configWarning');

  const editModal = document.getElementById('editModal');
  const editModalTitle = document.getElementById('editModalTitle');
  const editModalSubtitle = document.getElementById('editModalSubtitle');
  const editModalLabel = document.getElementById('editModalLabel');
  const editModalInput = document.getElementById('editModalInput');
  const editModalCancel = document.getElementById('editModalCancel');
  const editModalSave = document.getElementById('editModalSave');
  let activeEditId = null;
  let activeEditField = null; // 'noResi' atau 'progres'

  const FIELD_CONFIG = {
    noResi: { title: 'Isi No Resi', label: 'No Resi', placeholder: 'Contoh: JX123456789', action: 'updateResi', payloadKey: 'noResi' },
    progres: { title: 'Update Progres', label: 'Progres', placeholder: 'Contoh: Diproses gudang', action: 'updateProgres', payloadKey: 'progres' }
  };

  function openEditModal(field, id, nama, currentValue) {
    const cfg = FIELD_CONFIG[field];
    activeEditId = id;
    activeEditField = field;
    editModalTitle.textContent = cfg.title;
    editModalLabel.textContent = cfg.label;
    editModalInput.placeholder = cfg.placeholder;
    editModalSubtitle.textContent = 'Request atas nama ' + nama;
    editModalInput.value = currentValue || '';
    editModal.classList.add('open');
    editModalInput.focus();
  }

  function isConfigured() {
    return WEB_APP_URL && WEB_APP_URL.indexOf('http') === 0;
  }

  function fmtDate(v) {
    if (!v) return '';
    const d = new Date(v);
    if (isNaN(d)) return v;
    return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  async function loadRequests() {
    if (!isConfigured()) {
      configWarning.style.display = 'block';
      tableWrap.innerHTML = '<div class="empty-state">Belum bisa memuat data — isi WEB_APP_URL dulu.</div>';
      return;
    }
    try {
      const res = await fetch(WEB_APP_URL);
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Gagal memuat data');
      renderTable(json.data);
    } catch (err) {
      tableWrap.innerHTML = '<div class="empty-state">Gagal memuat data: ' + err.message + '</div>';
    }
  }

  function renderTable(rows) {
    if (!rows || rows.length === 0) {
      tableWrap.innerHTML = '<div class="empty-state">Belum ada request.</div>';
      return;
    }

    let html = '<table><thead><tr>' +
      '<th>Nama</th><th>Lokasi</th><th>No Kursi</th><th>Alamat Diterima</th>' +
      '<th>Parts</th><th>Foto</th><th>No Resi</th><th>Progres</th>' +
      '</tr></thead><tbody>';

    rows.forEach(function (r) {
      const hasResi = r.noResi && String(r.noResi).trim() !== '';
      const hasFoto = r.fotoId && String(r.fotoId).trim() !== '';
      const hasProgres = r.progres && String(r.progres).trim() !== '';
      html += '<tr>' +
        '<td data-label="Nama">' + escapeHtml(r.nama) + '</td>' +
        '<td data-label="Lokasi">' + escapeHtml(r.lokasi) + '</td>' +
        '<td data-label="No Kursi">' + escapeHtml(r.noKursi) + '</td>' +
        '<td data-label="Alamat Diterima">' + escapeHtml(r.alamatDiterima) + '</td>' +
        '<td data-label="Parts">' + escapeHtml(r.parts).replace(/\n/g, '<br>') + '</td>' +
        '<td data-label="Foto">' +
          (hasFoto
            ? '<a href="https://drive.google.com/file/d/' + encodeURIComponent(r.fotoId) + '/view" target="_blank" rel="noopener">' +
                '<img class="foto-thumb" src="https://drive.google.com/thumbnail?id=' + encodeURIComponent(r.fotoId) + '&sz=w150" alt="Foto request"></a>'
            : '<span class="hint-text">—</span>') +
        '</td>' +
        '<td data-label="No Resi">' +
          (hasResi
            ? '<span class="badge ok">' + escapeHtml(r.noResi) + '</span>'
            : '<span class="badge pending">Belum diisi</span>') +
          '<button class="resi-btn field-edit-btn" data-field="noResi" data-id="' + r.id + '" data-nama="' + escapeAttr(r.nama) + '" data-value="' + escapeAttr(r.noResi || '') + '">' +
            (hasResi ? 'Ubah' : 'Isi') +
          '</button>' +
        '</td>' +
        '<td data-label="Progres">' +
          (hasProgres
            ? '<span class="badge progres">' + escapeHtml(r.progres) + '</span>'
            : '<span class="badge pending">Belum ada</span>') +
          '<button class="resi-btn field-edit-btn" data-field="progres" data-id="' + r.id + '" data-nama="' + escapeAttr(r.nama) + '" data-value="' + escapeAttr(r.progres || '') + '">' +
            (hasProgres ? 'Ubah' : 'Isi') +
          '</button>' +
        '</td>' +
        '</tr>';
    });

    html += '</tbody></table>';
    tableWrap.innerHTML = html;

    tableWrap.querySelectorAll('.field-edit-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        openEditModal(
          btn.getAttribute('data-field'),
          btn.getAttribute('data-id'),
          btn.getAttribute('data-nama'),
          btn.getAttribute('data-value')
        );
      });
    });
  }

  function escapeHtml(str) {
    if (str === undefined || str === null) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escapeAttr(str) {
    return escapeHtml(str).replace(/"/g, '&quot;');
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!isConfigured()) {
      formStatus.textContent = 'WEB_APP_URL belum diisi.';
      formStatus.className = 'status-msg error';
      return;
    }

    const partsResult = collectParts();
    if (partsResult.count === 0) {
      formStatus.textContent = 'Isi minimal satu part.';
      formStatus.className = 'status-msg error';
      return;
    }

    const payload = {
      action: 'create',
      nama: document.getElementById('nama').value.trim(),
      lokasi: document.getElementById('lokasi').value.trim(),
      noKursi: document.getElementById('noKursi').value.trim(),
      alamatDiterima: document.getElementById('alamatDiterima').value.trim(),
      parts: partsResult.text
    };

    if (fotoDataUrl) {
      const commaIdx = fotoDataUrl.indexOf(',');
      payload.fotoBase64 = fotoDataUrl.slice(commaIdx + 1);
      payload.fotoType = 'image/jpeg';
      payload.fotoName = 'request-' + Date.now() + '.jpg';
    }

    submitBtn.disabled = true;
    formStatus.textContent = 'Mengirim…';
    formStatus.className = 'status-msg';

    try {
      const res = await fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Gagal mengirim');

      form.reset();
      resetPartRows();
      resetFoto();
      formStatus.textContent = 'Request terkirim.';
      formStatus.className = 'status-msg success';
      loadRequests();
    } catch (err) {
      formStatus.textContent = 'Gagal: ' + err.message;
      formStatus.className = 'status-msg error';
    } finally {
      submitBtn.disabled = false;
    }
  });

  editModalCancel.addEventListener('click', function () {
    editModal.classList.remove('open');
    activeEditId = null;
    activeEditField = null;
  });

  editModalSave.addEventListener('click', async function () {
    if (!activeEditId || !activeEditField) return;
    const val = editModalInput.value.trim();
    if (!val) { editModalInput.focus(); return; }

    const cfg = FIELD_CONFIG[activeEditField];
    const payload = { action: cfg.action, id: activeEditId };
    payload[cfg.payloadKey] = val;

    editModalSave.disabled = true;
    try {
      const res = await fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Gagal menyimpan');

      editModal.classList.remove('open');
      activeEditId = null;
      activeEditField = null;
      loadRequests();
    } catch (err) {
      alert('Gagal menyimpan: ' + err.message);
    } finally {
      editModalSave.disabled = false;
    }
  });

  const statusUploadBtn = document.getElementById('statusUploadBtn');
  const daftarRequestPanel = document.getElementById('daftarRequestPanel');

  statusUploadBtn.addEventListener('click', function () {
    const isHidden = daftarRequestPanel.style.display === 'none';
    daftarRequestPanel.style.display = isHidden ? 'block' : 'none';
    if (isHidden) {
      daftarRequestPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  loadRequests();
